[build]
  command   = "bash scripts/netlify-build.sh"
  publish   = "_site"

[build.environment]
  QUARTO_VERSION = "1.8.24"

# Redirects from the old Hexo-based site (pre-migration URL structure).
# Google still has these indexed; without redirects they 404 and the old
# ranking/link equity is lost instead of transferred to the new pages.

# Old Hexo hub/listing pages -> closest equivalent on the new site
[[redirects]]
  from   = "/archives/"
  to     = "/articles/index.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/archives/*"
  to     = "/articles/index.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/categories/*"
  to     = "/articles/index.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/tags/*"
  to     = "/articles/index.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/page/*"
  to     = "/articles/index.html"
  status = 301
  force  = true

# Remaining old dated posts with no current equivalent content -> articles hub
# (better than a bare 404 for retained link equity; content itself was retired
# in the migration rather than 1:1 ported)
[[redirects]]
  from   = "/posts/*"
  to     = "/articles/index.html"
  status = 301
  force  = true

# LaTeX series retired 2026-07-31; Google had these indexed under both the
# post-migration URL structure and an even older dated-permalink structure.
[[redirects]]
  from   = "/articles/posts/latex/*"
  to     = "/articles/index.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/articles/posts/2026/*"
  to     = "/articles/index.html"
  status = 301
  force  = true

# Orphaned Hexo-era paths with no current equivalent (old auth/comment
# plugin pages, not part of the current static site).
[[redirects]]
  from   = "/login"
  to     = "/articles/index.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/register"
  to     = "/articles/index.html"
  status = 301
  force  = true
