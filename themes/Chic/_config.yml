# Header
navname: 岳氏礦泉水
navname_en: Yueswater Blog

# Navbar logo -- light-theme pages use the light-colored icon on a black
# plate, dark-theme pages use the dark-colored icon on a white plate (the
# plate color is set in CSS; the two files just differ in icon color).
logo_light: /assets/logo-light.svg
logo_dark: /assets/logo-dark.svg

# navigatior items
## keys are i18n string ids (see languages/*.yml, nav_<id>), not display text.
## sections marked lang_split get "-en" appended to their href on English pages.
nav:
  articles: /articles
  projects: /projects
  # dsa: /dsa  # archived for now, see archive/dsa
  diary: /diary
  category: /category
  tag: /tag
  about: /about
nav_lang_split:
  - articles
  - projects
  # - dsa
  - diary
  - about

# favicon
favicon: /assets/favicon.svg

# Supabase (powers per-page view counts; anon key is meant to be public,
# it's restricted to SELECT on page_views + EXECUTE on increment_page_view)
supabase_url: https://oiebjktmnefstbzgyhdg.supabase.co
supabase_anon_key: sb_publishable_tsZ5iEV8MB6ue78FLQpTUw_0zJv_r35

# Profile
nickname: 岳氏礦泉水
nickname_en: Anthony

### this variable is MarkDown form.
description: 個人部落格——教學文章、專案與生活筆記。
description_en: Personal blog — tutorials, projects, and life notes.
avatar: /image/avatar.png
# Homepage avatar pool (themes/Chic/source/image/avatars/<name>.svg). Each
# visitor's browser swaps to a different one every 12-24 hours; `avatar`
# above stays the static fallback and the og:image.
# scale/x/y fit each face inside the avatar circle (x, y in % of the image box,
# applied as translate(x%, y%) scale(scale)); tuned per image so the head is centered
# and the bust's flat bottom edge is cropped by the circle.
avatars:
  - {name: original, scale: 1.254, x: 2.1, y: -0.3}
  - {name: face-right-surprised, scale: 1.234, x: -0.1, y: 4.1}
  - {name: face-front-sleepy, scale: 1.168, x: 0.1, y: 2.2}
  - {name: face-left-profile-thinking, scale: 1.302, x: -0.5, y: 7.8}
  - {name: face-front-laughing, scale: 1.224, x: 0.1, y: 9.5}
  - {name: face-right-confident, scale: 1.269, x: -2.0, y: 10.3}
  - {name: face-left-explaining, scale: 1.1, x: 6, y: 2}
  - {name: face-right-wink, scale: 1.302, x: -1.5, y: 9.8}
  - {name: face-front-excited, scale: 1.209, x: 0.9, y: 9.6}
  - {name: face-left-content, scale: 1.296, x: 1.6, y: 9.1}

# main menu navigation
## each entry is {url, icon}; icon must match a key in the linkIcons
## map in layout/_page/profile.ejs.
links:
  FB:
    url: https://www.facebook.com/yueswater/
    icon: facebook
  IG:
    url: https://instagram.com/yueswater
    icon: instagram
  Threads:
    url: https://www.threads.com/@yueswater
    icon: threads
  Email:
    url: mailto:contact@yueswater.com
    icon: envelope
  GitHub:
    url: https://github.com/yueswater
    icon: github

# how links show: you have 2 choice--text or icon.
links_text_enable: false
links_icon_enable: true

# Post page
## Post_meta
post_meta_enable: true

post_author_enable: true
post_date_enable: true
post_category_enable: true
## Post copyright
post_copyright_enable: true

post_copyright_author_enable: true
post_copyright_permalink_enable: true
post_copyright_license_enable: true
post_copyright_license_text: 本文採用 <a href="http://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a> 授權
post_copyright_license_text_en: This work is licensed under <a href="http://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>
post_copyright_slogan_enable: false
post_copyright_slogan_text: ""
## toc
post_toc_enable: true

# Page
page_title_enable: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm

# stylesheets loaded in the <head>
stylesheets:
  - /css/style.css
  - /css/admonition.css
  - /css/admonition-override.css
  - /css/code-copy.css
  - /css/caption.css
  - /css/permalink-copy.css
  - /css/tabset.css
  - /css/citations.css
  - /css/problem-statement.css
  - /css/site-logo.css
  - /css/gallery.css

# scripts loaded in the end of the body
scripts:
  - /js/script.js
  - /js/tocbot.min.js
    # tscanlin/tocbot: Build a table of contents from headings in an HTML document.
    # https://github.com/tscanlin/tocbot
  - /js/clipboard.min.js
  - /js/code-copy.js
  - /js/permalink-copy.js
  - /js/supabase-views.js
  - /js/tabset.js
  - /js/gallery.js

# plugin functions
## Mathjax: Math Formula Support
## https://www.mathjax.org
mathjax:
  enable: true
  import: demand # global or demand
  ## global: all pages will load mathjax,this will degrade performance and some grammers may be parsed wrong.
  ## demand: Recommend option,if your post need fomula, you can declare 'mathjax: true' in Front-matter
