Typst: |
  由 Laurenz Mädje 與 Martin Haug 於 2019 年開始開發的新一代排版系統，核心用 Rust 撰寫，2023 年 3 月以 Apache 2.0 授權開源，主打編譯速度快、語法簡潔、錯誤訊息友善。

增量編譯: |
  Typst 的編譯技術，只重新運算變動的部分，讓線上編輯器能做到毫秒等級的即時預覽，不必每次都全文重新編譯。

Tinymist: |
  官方推薦的 VS Code 插件（`myriad-dreamin.tinymist`），提供 Typst 語法高亮、即時預覽、自動補全與錯誤提示等語言服務。

"typst.app": |
  Typst 官方提供的線上編輯器，開瀏覽器即可撰寫與預覽 `.typ` 檔案，體驗接近 LaTeX 使用者熟悉的 Overleaf。

Playground: |
  typst.app 登入後提供的線上練習環境，左側撰寫 Typst 語法、右側即時渲染排版結果，並可直接分享連結或匯出檔案。

"`.typ`": |
  Typst 原始碼檔案的副檔名，本機 CLI 與 typst.app 線上編輯器所編輯的檔案格式相通。

LaTeX: |
  自 1984 年起沿用至今的排版系統，功能完整、社群龐大，但語法冗長、編譯速度慢，是 Typst 設計時主要對照與想解決的痛點來源。
